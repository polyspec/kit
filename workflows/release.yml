# Release workflow of a repository that adopts kit. The package @polyspec/kit ships this file as an example; a repository that
# wants it copies it to .github/workflows/release.yml and owns the copy, which kit neither writes nor compares (K1052).
#
# The workflow starts by itself when a push run of the CI workflow ci succeeds on main (K987): it checks out the head_sha of that
# run, and release-tag with AUTO releases the top ## X.Y.Z of its change log at that commit when it is the version commit of that
# version, or a later commit whose ## Unreleased is empty (K988, K990); a commit whose top version is tagged on its line ends green
# with nothing to release, a later commit with unreleased entries waits for the CI run of the version commit while it runs, and
# fails naming the version commit once that run ended without a release. A concurrency group of the job runs one release of the
# repository at a time.
# A dispatch of the workflow with the id of a successful CI run releases the commit of that run (K911): it tags the commit with
# the version of the newest section ## X.Y.Z of its change log (K924) and creates the GitHub Release of the tag as a draft with
# its archives, and makes it public. The run is the evidence; the release runs no test again. The job is one recipe, make ci-release
# (K1250), whose steps run in order and stop at the first failure:
#   bootstrap        the bootstrap action: make bootstrap installs the locked kit, the mise, node and npm of mise.toml and the packages
#   release-tag      with the kit of main: requires a completed successful push or dispatch run RUN of ci.yml whose
#                    commit is on the main ref that the recipe names in RELEASE_MAIN (kit.mk names origin/main; none exits 2,
#                    K1102), reads X.Y.Z from the
#                    change log of that commit, creates and pushes the annotated
#                    tag vX.Y.Z and the tag of every Go module at that commit, or passes for a tag there already (K269), and
#                    writes TAG and VERSION into the environment file of the run; a tag pushed with the token of the run starts no run
#   checkout of the tag, then make bootstrap of the tagged commit again
#   release-prepare  the preparation that the release of the repository declares with release-prepare:: (none by default)
#   release-tools    installs the tools that config/release.json needs for the packages of this repository; a make entry adds none
#   release-assets  builds the archive of every package, and packages.json of the Composer packages, into the folder of
#                   RELEASE_ASSETS, which the recipe names (kit.mk names var/release/assets; none exits 2, K1102)
#   release-publish creates the GitHub Release of the tag as a draft, with its notes and those files
#   release-undraft makes the release public
# A failed step leaves the release a draft and fails the run.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run:
        description: The id of the successful CI run whose exact commit is released
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    # A workflow_run starts the release for a successful push or dispatch run of CI alone (K987). The concurrency group is the job's,
    # so a run whose job is skipped never replaces the pending release of a version commit.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) }}
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    env:
      RUN: ${{ inputs.run || github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # actions/checkout v7.0.1: with the whole history and every branch, so origin/main is there for the ancestry check; a
      # workflow_run checks out the head_sha of its CI run, never a later main (K987), and a dispatch checks out main, whose kit
      # runs release-tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      # shivammathur/setup-php 2.40.0: the PHP of .php-version for the Composer packages and the extension of the release. A
      # repository that needs PHP (a Composer package of config/release.json, or php of config/toolchain.json) declares
      # .php-version (K193); a repository without PHP has none and sets up no PHP. The release runs no gate of its own:
      # release-tag refuses a commit whose CI run did not pass (K755).
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ hashFiles('.php-version') != '' }}
        with:
          php-version-file: .php-version
          # The proof runs with no debugger or coverage driver, as the checks do.
          coverage: none
      # The bootstrap of kit (K992): the Node.js of mise.toml, the locked kit package, the npm of var/tools and the packages.
      - uses: ./.github/actions/kit-bootstrap
      # The release job is one recipe (K1250): release-tag of RUN, then the bootstrap of the tagged commit with its own kit and
      # packages and its release steps in order (scripts/kit/kit.mk). A local run is the same make ci-release with RUN and
      # GH_TOKEN in the environment.
      - run: make ci-release
