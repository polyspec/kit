# The CI pipeline of kit in a repository that adopts it (K270, K910). The package @polyspec/kit ships this file as an example;
# a repository that wants it copies it to .github/workflows/ci-pipeline.yml and owns the copy, which kit neither writes nor
# compares (K1052). The repository's own .github/workflows/ci.yml holds the triggers and the concurrency and calls it as a job
# (`uses: ./.github/workflows/ci-pipeline.yml`), so one push runs one workflow: plan first, then independent shared and
# runtime checks, then required. Each job has one run step, `make ci-<job>` with make variables only (K1250): the recipe reads
# the tools and the targets of its job from config/ci.json, installs first and stops at a failure, runs kit's gate of its group
# and the targets of config/ci.json (targets.shared, targets.runtimes.<runtime>) through make ci-targets, every target to its end,
# inside its context, and cleans up. A local run of a job is the same call, such as `make ci-runtime RUNTIME=go`. The other steps
# only provision the runner or carry a result.
name: ci-pipeline

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Only the fan-out is shared between jobs; checks use their own checkout, setup and context.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      runtimes: ${{ steps.plan.outputs.runtimes }}
      runner: ${{ steps.plan.outputs.runner }}
      has_runtimes: ${{ steps.plan.outputs.has_runtimes }}
      shared_php: ${{ steps.plan.outputs.shared_php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # The bootstrap of kit (K992): the Node.js of mise.toml and make bootstrap, which installs the locked kit package, the npm
      # of var/tools and the packages.
      - uses: ./.github/actions/kit-bootstrap
      - id: plan
        run: make ci-plan

  shared:
    needs: [plan]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/kit-bootstrap
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ needs.plan.outputs.shared_php == 'true' }}
        with:
          php-version-file: .php-version
          tools: none
          coverage: none
      - run: make ci-shared
      # actions/upload-artifact v7.0.1: the report of make ci-targets, var/report/ci-targets.
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kit-report-shared
          path: var/report/ci-targets/
          if-no-files-found: ignore

  runtime:
    needs: [plan]
    if: ${{ needs.plan.outputs.has_runtimes == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.runtimes) }}
    runs-on: ${{ needs.plan.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ matrix.runtime == 'php' || matrix.runtime == 'php-ext' }}
        with:
          php-version-file: .php-version
          tools: none
          coverage: none
      - uses: ./.github/actions/kit-bootstrap
      - run: make ci-runtime RUNTIME=${{ matrix.runtime }}
      # actions/upload-artifact v7.0.1: the report of make ci-targets, var/report/ci-targets.
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kit-report-runtime-${{ matrix.runtime }}
          path: var/report/ci-targets/
          if-no-files-found: ignore

  # The closing common part: it fails when a job that the plan selected does not succeed. The plan selects shared, and runtime
  # when config/ci.json declares one (K950), which make ci-required reads; a job the plan did not select is skipped and is not a
  # result, and a selected job that is skipped fails the pipeline. It runs on the default runner even when planning fails.
  required:
    if: ${{ always() }}
    needs: [plan, shared, runtime]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/kit-bootstrap
      - run: make ci-required RESULTS='${{ toJSON(needs) }}'
