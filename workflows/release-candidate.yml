# The proof of the release assets before a release (K1211): an example that a repository copies to
# .github/workflows/release-candidate.yml, owns, and calls from its CI (uses: ./.github/workflows/release-candidate.yml), so that
# the job that judges the CI run requires it. It builds the candidate assets of every asset set of config/release.json from the
# commit of the run, each set on the runner of its platform, with the steps that the job assets of the release workflow runs for
# a tag. A release tags only the commit of a successful CI run, so a set that does not build stops the release before a tag is
# made.
#   the job sets:
#   release-sets              prints the asset sets with the runner of each, and the newest version of the change log
#   the job candidate, one per set on the runner of its platform:
#   release-prepare           the preparation that the repository declares
#   release-tools             installs the tools that config/release.json needs
#   release-tools-path        puts the installed tools on the PATH of the later steps
#   release-candidate-assets  builds the assets of the set, RELEASE_PLATFORM and RELEASE_PHP, from HEAD for VERSION
# A job that builds the native asset of a platform runs on a runner of that platform, whatever runner the rules of the repository
# name for its other jobs, since no tool cross-compiles (K1189). Every set is built to its end: fail-fast is off.
name: release-candidate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sets:
    runs-on: ubuntu-24.04
    outputs:
      sets: ${{ steps.sets.outputs.sets }}
      version: ${{ steps.sets.outputs.version }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/kit-bootstrap
      - name: list the asset sets
        id: sets
        run: make release-sets

  candidate:
    needs: sets
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.sets.outputs.sets) }}
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.sets.outputs.version }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
      RELEASE_PHP: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: verify the archive tool
        run: command -v zip >/dev/null || { echo 'Info-ZIP is required for the Composer, PHP extension and Go archives; install the zip package on the runner'; exit 1; }
      # shivammathur/setup-php 2.40.0: the PHP minor of the set for a php-ext binary, else the PHP of .php-version.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ matrix.php != '' }}
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ matrix.php == '' && hashFiles('.php-version') != '' }}
        with:
          php-version-file: .php-version
          coverage: none
      - uses: ./.github/actions/kit-bootstrap
      - name: prepare the release of the repository
        run: make release-prepare
      - name: make release-tools
        run: make release-tools
      - name: put the installed tools on PATH
        run: make release-tools-path
      - name: build the candidate assets of the set
        run: make release-candidate-assets
