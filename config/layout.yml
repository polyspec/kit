# The folder layout of kit (S5, S7, S9), checked by make layout-check: the common rules of config/layout.kit.yml and the map
# of this repository. kit is the repository of the tools, not a monorepo of packages, so it has no packages/.
version: 1
extends:
  - layout.kit.yml

rules:
  - extends_template: no-repository-prefix
    id: layout-no-repository-prefix
    vars: { repo: kit }

  - extends_template: go-module-path
    id: layout-go-module-path
    vars: { repo: kit }

  - id: layout-root-folders
    paths:
      - "*"
      - "!packages"
      - "!contracts"
      - "!docs"
      - "!scripts"
      - "!tests"
      - "!examples"
      - "!benchmarks"
      - "!config"
      - "!.github"
      - "!.githooks"
      - "!.kit"
      # The uv locks of the pypi: tools of mise.lock, which mise writes (make toolchain-lock).
      - "!.mise"
      # The example workflows that the package ships; a repository copies one to .github/workflows/ (K1052).
      - "!workflows"
      # The example bootstrap action that the package ships; a repository copies it to .github/actions/ (K992, K1052).
      - "!actions"
      # The settings that Claude Code reads (S1), with the hook of kit's own checkout.
      - "!.claude"
      # The example Claude Code settings that the package ships; a repository copies them to .claude/ (K1052).
      - "!claude"

  # The extension of the PHP extension tests holds its stub as data of the tests (S10).
  - id: php-ext-stub-place
    paths: ["**/*.stub.php", "!packages/php-ext/src/*.stub.php", "!tests/kit/php-ext-fixture/*.stub.php"]

  - id: layout-root-tests
    paths:
      - "tests/*"
      - "!tests/kit"
      # The tests of kit itself that run the real tools of var/tools (make source-test).
      - "!tests/source"

  # kit builds its package into dist/ with tsconfig.build.json (make kit-build); the other root files are the common ones.
  - id: layout-root-files
    vars: { root_files: "{tsconfig.build.json}" }

  - id: layout-no-pythonpath
    paths:
      - "config/**"
      - "scripts/**"
      - "tests/**"
      - "Makefile"
      - ".github/**"
      - "packages/**/Makefile"
      - "packages/**/*.toml"
      - "packages/**/*.json"
      - "packages/**/*.cfg"
      - "packages/**/*.ini"
      # The layout rules name PYTHONPATH to forbid it.
      - "!config/layout.kit.yml"
      - "!config/layout.yml"
      # The real layout test of kit plants PYTHONPATH into a fixture repository to see the rule fail.
      - "!tests/source/layout-real.test.mts"

  # S9 exception: the PHP programs of kit (K75) read PHP with nikic/php-parser and the Reflection API, which only a program of
  # that language can call.
  - id: layout-infrastructure-typescript
    paths:
      - "scripts/**/*.{js,mjs,cjs,py,sh,bash,zsh,rb,pl,php,go,rs,ps1,bat,cmd}"
      - "tests/**/*.{js,mjs,cjs,py,sh,bash,zsh,rb,pl,php,go,rs,ps1,bat,cmd}"
      # The fixture checkouts of kit hold the packages of a consumer repository as test data, not infrastructure.
      - "!tests/kit/fixture/**"
      # The extension of the PHP extension tests (S10): its stub is PHP, which gen_stub.php reads, as data of the tests.
      - "!tests/kit/php-ext-fixture/**"
      - "!scripts/kit/symbols/**"
      # PHPUnit prepends the deadline file into the PHP of its run, so only a PHP file can be it.
      - "!scripts/kit/php-library/**"
      # The runner of the python tests runs unittest inside the Python of the tests, which only a program of that language can do (K371).
      - "!scripts/kit/runners/**"
