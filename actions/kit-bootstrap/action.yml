# The one bootstrap of every CI job of a repository (K992): the package ships it as an example, which a repository copies to
# .github/actions/kit-bootstrap/action.yml and owns (K1052), and ci-pipeline.yml, release.yml and the jobs of the repository's own workflows run it after their checkout with
# `uses: ./.github/actions/kit-bootstrap`, so no workflow carries a copy of these steps that a kit release leaves behind. The
# runtime and release jobs set PHP up before it; the shared job of ci-pipeline sets it up after. It provisions Node.js and then
# runs make bootstrap, the target that a local bootstrap runs too (K1250), which the repository's own Makefile defines, as
# docs/examples/bootstrap.mk and the Makefile of kit show (K1054).
name: kit bootstrap
description: Sets up the Node.js of mise.toml, then runs make bootstrap, which installs the locked kit package, the npm of var/tools and the packages of package-lock.json.
runs:
  using: composite
  steps:
    # actions/setup-node v7.1.0: the Node.js of mise.toml starts the bootstrap, which installs that release into var/tools with
    # mise (K171); the tools of @polyspec/kit then run the node of var/tools. The pinned npm of var/tools installs the packages,
    # so the cache of setup-node is off.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version-file: mise.toml
        package-manager-cache: false
    - name: bootstrap
      shell: bash
      run: make bootstrap
