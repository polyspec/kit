# Release workflow of a repository that adopts kit. The package @polyspec/kit ships this file as an example; a repository that
# wants it copies it to .github/workflows/release.yml and owns the copy, which kit neither writes nor compares (K1052).
#
# The workflow starts by itself when a push run of the CI workflow ci succeeds on main (K987): it checks out the head_sha of that
# run, and release-tag with AUTO releases the top ## X.Y.Z of its change log at that commit when it is the version commit of that
# version, or a later commit whose ## Unreleased is empty (K988, K990); a commit whose top version is tagged on its line ends green
# with nothing to release, a later commit with unreleased entries waits for the CI run of the version commit while it runs, and
# fails naming the version commit once that run ended without a release. A concurrency group of the job runs one release of the
# repository at a time.
# A dispatch of the workflow with the id of a successful CI run releases the commit of that run (K911): it tags the commit with
# the version of the newest section ## X.Y.Z of its change log (K924) and creates the GitHub Release of the tag as a draft with
# its assets, and makes it public. The run is the evidence; the release runs no test again. The jobs run in order, tag, then
# assets, then publish, and the steps of a job stop at its first failure; each step runs one make target of kit:
#   the job tag:
#   bootstrap package installs the locked kit with the npm that devEngines.packageManager names for consumers, without scripts
#   install-tools TOOLS=npm installs the mise, the node and the npm of mise.toml with the copied installer of scripts/kit/bootstrap
#   install-packages installs package-lock.json with that npm, @polyspec/kit included; the recipes of the repository have the targets below
#   release-tag      with the kit of main: requires a completed successful push or dispatch run RUN of ci.yml whose commit is on
#                    the main ref that the recipe names in RELEASE_MAIN (kit.mk names origin/main; none exits 2, K1102), reads
#                    X.Y.Z from the change log of that commit, creates and pushes the annotated tag vX.Y.Z and the tag of every
#                    Go module at that commit, or passes for a tag there already (K269), and writes tag and version to the
#                    outputs of its step (K1189); a tag pushed with the token of the run starts no run
#   checkout of the tag, then the bootstrap, npm and the packages of the tagged commit again
#   release-sets     prints the asset sets of config/release.json as the include list of a matrix and writes it to the outputs
#                    of its step (K1189): the set without a platform, the set of each platform of a per-platform package
#                    (wheel-abi3, npm-native, go-static) and the set of each platform and PHP minor of a php-ext package
#   the job assets, one per set on a runner of its platform, with the tag checked out and kit bootstrapped:
#   release-prepare  the preparation that the release of the repository declares with release-prepare:: (none by default)
#   release-tools    installs the tools that config/release.json needs for the packages of this repository; a make entry adds none
#   release-tools-path puts var/tools/bin on the PATH of the steps that follow, through GITHUB_PATH
#   release-assets   builds the assets of its set, RELEASE_PLATFORM and RELEASE_PHP, into the folder of RELEASE_ASSETS, which the
#                    recipe names (kit.mk names var/release/assets; none exits 2, K1102); the job uploads them as an artifact
#   the job publish, with the artifacts of every set downloaded into that folder:
#   release-go-modules tags the Go module of each go-static package that declares one, at a commit of no branch that carries its
#                    generated files and the library of every platform (K1205); it runs only when one is declared
#   release-publish  creates the GitHub Release of the tag as a draft, with its notes and the assets of every set, each with its label
#   release-undraft  makes the release public
# A platform set builds on its own platform, since no tool cross-compiles (K1189). A failed job leaves the release a draft, or
# leaves no release, and fails the run.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run:
        description: The id of the successful CI run whose exact commit is released
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  tag:
    # A workflow_run starts the release for a successful push or dispatch run of CI alone (K987). The concurrency group is the job's,
    # so a run whose job is skipped never replaces the pending release of a version commit.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) }}
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    env:
      RUN: ${{ inputs.run || github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sets: ${{ steps.sets.outputs.sets }}
      go-modules: ${{ steps.sets.outputs.go-modules }}
    steps:
      # actions/checkout v7.0.1: with the whole history and every branch, so origin/main is there for the ancestry check; a
      # workflow_run checks out the head_sha of its CI run, never a later main (K987), and a dispatch checks out main, whose kit
      # runs release-tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      # The bootstrap of kit (K992): the Node.js of mise.toml, the locked kit package, the npm of var/tools and the packages.
      - uses: ./.github/actions/kit-bootstrap
      - name: tag the commit of the CI run
        id: tag
        run: make release-tag ${{ github.event_name == 'workflow_run' && 'AUTO=1' || '' }}
      # The sets are those of the tagged commit, read with its own kit.
      - name: check out the tag
        if: ${{ steps.tag.outputs.tag != '' }}
        run: git checkout --quiet "$TAG"
      - uses: ./.github/actions/kit-bootstrap
        if: ${{ steps.tag.outputs.tag != '' }}
      - name: list the asset sets
        id: sets
        if: ${{ steps.tag.outputs.tag != '' }}
        run: make release-sets

  assets:
    needs: tag
    if: ${{ needs.tag.outputs.tag != '' }}
    strategy:
      matrix: ${{ fromJson(needs.tag.outputs.sets) }}
    # The set without a platform and the sets of linux-x64-gnu build on ubuntu-24.04, those of linux-arm64-gnu on ubuntu-24.04-arm
    # and those of darwin-arm64 on macos-15.
    runs-on: ${{ matrix.platform == 'linux-arm64-gnu' && 'ubuntu-24.04-arm' || matrix.platform == 'darwin-arm64' && 'macos-15' || 'ubuntu-24.04' }}
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
      RELEASE_PHP: ${{ matrix.php }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - name: verify the archive tool
        run: command -v zip >/dev/null || { echo 'Info-ZIP is required for the Composer, PHP extension and Go archives; install the zip package on the runner'; exit 1; }
      # shivammathur/setup-php 2.40.0: the PHP minor of the set for a php-ext binary, else the PHP of .php-version for the Composer
      # packages. A repository without PHP has no .php-version and its sets name no PHP minor, so it sets up no PHP. The release
      # runs no gate of its own: release-tag refuses a commit whose CI run did not pass (K755).
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ matrix.php != '' }}
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ matrix.php == '' && hashFiles('.php-version') != '' }}
        with:
          php-version-file: .php-version
          # The proof runs with no debugger or coverage driver, as the checks do.
          coverage: none
      # The bootstrap of kit for the tagged commit, with its own kit and packages (K992).
      - uses: ./.github/actions/kit-bootstrap
      - name: prepare the release of the repository
        run: make release-prepare
      - name: make release-tools
        run: make release-tools
      # The tools of var/tools/bin — the Go and the Rust of mise.toml that the release builds with, and whatever else the packages
      # need — join PATH for the steps that follow; a step's PATH is its own, so the export goes to the file the runner reads
      # between steps.
      - name: put the installed tools on PATH
        run: make release-tools-path
      - name: build the assets of the set
        run: make release-assets
      # actions/upload-artifact v7.0.1: the assets of the set, which the job publish gathers.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-assets-${{ matrix.platform || 'source' }}${{ matrix.php && format('-php{0}', matrix.php) || '' }}
          path: var/release/assets/
          if-no-files-found: error

  publish:
    needs: [tag, assets]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: ./.github/actions/kit-bootstrap
      # actions/download-artifact v8.0.2: the assets of every set in the one asset folder of release-publish.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-assets-*
          path: var/release/assets
          merge-multiple: true
      # The Go modules of the release (K1205): the generated files of each and the library of every platform, which the sets
      # built, in a commit of no branch that the tag <directory>/vX.Y.Z names. The step needs the tools of the repository, so they
      # are installed only when config/release.json declares a Go module; a failure makes no commit, no tag and no release.
      - name: prepare the release of the repository
        if: ${{ needs.tag.outputs.go-modules == 'true' }}
        run: make release-prepare
      - name: make release-tools
        if: ${{ needs.tag.outputs.go-modules == 'true' }}
        run: make release-tools
      - name: put the installed tools on PATH
        if: ${{ needs.tag.outputs.go-modules == 'true' }}
        run: make release-tools-path
      - name: tag the Go modules
        if: ${{ needs.tag.outputs.go-modules == 'true' }}
        run: make release-go-modules
      - name: create the draft release
        run: make release-publish
      - name: make the release public
        run: make release-undraft TAG="$TAG"
