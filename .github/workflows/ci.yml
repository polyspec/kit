name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Each job has one run step, `make ci-<job>` with make variables only, and a local run of the job is the same call (K1250): the
# recipe in the Makefile installs first and stops at a failure, then runs every check of the job to its end. The other steps
# provision the runner.
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # shivammathur/setup-php 2.40.0: the PHP of .php-version, which the Composer projects of kit (config/phpunit,
      # config/php-lint) require; the runner's own PHP is older.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version-file: .php-version
          tools: none
      # The Node.js of mise.toml and make bootstrap: the mise, node and npm of mise.toml, then the packages of package-lock.json
      # (K71-2, K992).
      - uses: ./.github/actions/kit-bootstrap
      - run: make ci-checks

  kit-tests:
    name: kit tests (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # These shards run Composer or the PHP extension fixture and need the declared PHP runtime.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ contains(fromJSON('[1,3,4,5,7]'), matrix.shard) }}
        with:
          php-version-file: .php-version
          tools: none
      - uses: ./.github/actions/kit-bootstrap
      - run: make ci-kit-tests SHARD=${{ matrix.shard }}

  source-tests:
    name: source tests (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        group: [ts, php, rust, go, python, common-1, common-2, common-3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # PHP source groups run PHP, Composer projects or PHPUnit; common-3 also exercises fresh PHP checkouts.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ contains(fromJSON('["php","common-1","common-2","common-3"]'), matrix.group) }}
        with:
          php-version-file: .php-version
          tools: none
      - uses: ./.github/actions/kit-bootstrap
      - run: make ci-source-tests GROUP=${{ matrix.group }}

  # The platform bootstrap smoke (K730) on Ubuntu x64, macOS arm64 and Windows x64, in the same run as the suite, so the run
  # that a release takes by its id covers it (K912). The bootstrap itself is under test, so the job sets up only the Node.js
  # that starts it; make runs in Bash on every platform, Git Bash on Windows.
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.12.0
          package-manager-cache: false
      - run: make ci-bootstrap

  kit:
    name: kit
    if: ${{ always() }}
    needs: [checks, kit-tests, source-tests, bootstrap]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: mise.toml
          package-manager-cache: false
      - run: make ci-kit NODE=node RESULTS='${{ toJSON(needs) }}'
