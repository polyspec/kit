name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kit:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v6.1.0; commits-check reads the commits of the run, so the checkout carries the full commit graph.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      # actions/setup-node v6.5.0: the Node.js of .node-version; npm ci below installs the packages with the pinned npm.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # shivammathur/setup-php 2.40.0: the PHP of .php-version, which the Composer projects of kit (config/phpunit,
      # config/php-lint) require; the runner's own PHP is older.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version-file: .php-version
          tools: none
      # The bootstrap order of a repository (K71-2): the npm of packageManager first, then the packages of package-lock.json
      # with it, then the other tools.
      - name: install npm
        run: make install-tools TOOLS=npm
      # The npm of packageManager installs TypeScript and the Node types from package-lock.json.
      - name: install packages
        run: var/tools/bin/npm ci
      # install-tools installs the Go of the kit pin (from its archive, since kit tracks a go.mod), the uv of config/toolchain.json,
      # the Python of pythonBuild with that uv and the pythonBackend into var/tools; the tests run that Go, uv and Python, not
      # those of the runner image, so var/tools/bin comes first on PATH.
      - name: install tools
        run: make install-tools
      - name: tools on PATH
        run: echo "$PWD/var/tools/bin" >> "$GITHUB_PATH"
      # cargo of the Rust pin for the tests that run cargo metadata: rustup, the one tool that the runner provides, installs the
      # channel of rust-toolchain.toml.
      - name: install rust
        run: rustup toolchain install
      # tsc checks the types of the tools and tests (tsconfig.json, K71-1).
      - name: typecheck
        run: make typecheck
      # alint, which install-tools installs from config/toolchain.json, checks the folder layout (S5) against config/layout.yml (K76).
      - name: layout check
        run: make layout-check
      # jscpd, which npm ci installs, fails while a piece of scripts/kit exists twice (K126).
      - name: duplication check
        run: make duplication-check
      # The tests include the mutation check of the gate, which runs on a copy of tests/kit/fixture.
      - name: kit tests
        run: make kit-test
      # The kit's own tests (tests/source) build the wheel with the Python and backend of install-tools; kit-sync does not vendor them.
      - name: source tests
        run: make source-test
      - name: documents check
        run: make documents-check
      # The commits the run was triggered by: those of the pull request over its base, or those of the push. A manual run and
      # the first push of a branch have no earlier commit, so the run checks HEAD.
      - name: commit range
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE" ]; then echo "range=$BASE..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then echo "range=$BEFORE..$GITHUB_SHA"
          else echo "range=HEAD"
          fi >> "$GITHUB_ENV"
      - name: commits check
        run: make commits-check RANGE="$range"
