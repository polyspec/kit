name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kit:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v7.0.1; commits-check reads the commits of the run, so the checkout carries the full commit graph.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # actions/setup-node v7.1.0: the Node.js of mise.toml starts the bootstrap, which installs that release into var/tools with
      # mise (K171); every later step runs the node of var/tools, and npm ci installs the packages with the pinned npm.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: mise.toml
          package-manager-cache: false
      # shivammathur/setup-php 2.40.0: the PHP of .php-version, which the Composer projects of kit (config/phpunit,
      # config/php-lint) require; the runner's own PHP is older.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version-file: .php-version
          tools: none
      # The bootstrap order of a repository (K71-2): the npm of packageManager first, then the packages of package-lock.json
      # with it, then the other tools.
      - name: install npm
        run: make install-tools TOOLS=npm
      # The npm of packageManager installs TypeScript and the Node types from package-lock.json.
      - name: install packages
        run: make install-packages
      # install-tools installs the tools of mise.toml at the digests of mise.lock with the mise of the bootstrap (Go, Python,
      # uv, ruff, alint, golangci-lint, deadcode, vulture, Composer), then the pythonBackend and the Composer projects, into
      # var/tools; kit.mk puts their shims first on PATH in every recipe, so the tests run those tools, not the runner image's.
      - name: install tools
        run: make install-tools
      # cargo of the Rust pin for the tests that run cargo metadata: rustup, the one tool that the runner provides, installs the
      # channel of rust-toolchain.toml.
      - name: install rust
        run: rustup toolchain install
      # tsc checks the types of the tools and tests (tsconfig.json, K71-1).
      - name: typecheck
        run: make typecheck
      # alint, which install-tools installs from mise.toml, checks the folder layout (S5) against config/layout.yml (K76).
      - name: layout check
        run: make layout-check
      # kit checks its own dependencies as each consumer does (K169): the manifests and locks against
      # config/dependency-policy.json and the review record config/dependency-review.json, offline, and that the gate rejects
      # each known mutation of the checkout. A dependency change without make dependency-review RECORD=1 fails here.
      - name: dependency policy check
        run: make dependency-policy-check
      - name: dependency policy mutation check
        run: make dependency-policy-mutation-check
      # jscpd, which npm ci installs, fails while a piece of scripts/kit exists twice (K126).
      - name: duplication check
        run: make duplication-check
      # kit lints itself with the TypeScript lint that its consumers get (K142): oxlint type-aware with .oxlintrc.json and
      # knip with knip.json, over scripts/kit (the copies of scripts/kit/bootstrap included) and the tests.
      - name: lint
        run: make lint-ts
      # The tests include the mutation check of the gate, which runs on a copy of tests/kit/fixture.
      - name: kit tests
        run: make kit-test
      # The kit's own tests (tests/source) build the wheel with the Python and backend of install-tools; kit-sync does not vendor them.
      - name: source tests
        run: make source-test
      - name: documents check
        run: make documents-check
      # The commits the run was triggered by: those of the pull request over its base, or those of the push. A manual run and
      # the first push of a branch have no earlier commit, so the run checks HEAD.
      - name: commit range
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE" ]; then echo "range=$BASE..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then echo "range=$BEFORE..$GITHUB_SHA"
          else echo "range=HEAD"
          fi >> "$GITHUB_ENV"
      - name: commits check
        run: make commits-check RANGE="$range"
